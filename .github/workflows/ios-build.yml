name: iOS Build and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Mostrar version de Xcode
        run: xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar y ejecutar pruebas
        run: |
          xcodebuild test \
            -project SwiftTest.xcodeproj \
            -scheme SwiftTest \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/SwiftTest.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Exportar capturas de pantalla
        if: always()
        run: |
          if [ -d "build/SwiftTest.xcresult" ]; then
            mkdir -p build/screenshots

            xcrun xcresulttool export attachments \
              --path build/SwiftTest.xcresult \
              --output-path build/screenshots
          fi

      - name: Guardar capturas como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SwiftTest-Screenshots
          path: build/screenshots/
          if-no-files-found: warn
          retention-days: 7